# Perfil "test": os testes rodam num H2 em memoria (modo Oracle), sem rede e
# sem tocar nos dados do Oracle da FIAP. Aqui o Hibernate CRIA o schema a
# partir das @Entity (create-drop), incluindo as sequences SQ_MTV_*.
spring.datasource.url=jdbc:h2:mem:motiva;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

logging.level.org.hibernate.SQL=WARN
