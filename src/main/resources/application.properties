spring.application.name=motiva-api

# =====================================================================
#  Credenciais: NUNCA no codigo Java nem no Git.
#  Vem de variaveis de ambiente (DB_USERNAME / DB_PASSWORD) ou do arquivo
#  .env na raiz do projeto (ignorado pelo Git; modelo em .env.example).
# =====================================================================
spring.config.import=optional:file:.env[.properties]

# =====================================================================
#  Banco: Oracle da FIAP, reaproveitando as tabelas T_MTV_* da Sprint 3.
#  Substitui o Singleton ConexaoBD: o Spring abre e gerencia um pool
#  de conexoes (HikariCP) sozinho.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.pool-name=MotivaPool
spring.datasource.hikari.maximum-pool-size=5

# =====================================================================
#  JPA / Hibernate
# =====================================================================
# validate: na subida o Hibernate confere se cada @Entity bate com as
# tabelas e sequences do banco, SEM alterar nada. Quem cria o schema sao
# os scripts da pasta sql/.
spring.jpa.hibernate.ddl-auto=validate
# Conexao so durante o @Transactional do Service (nada de lazy loading no Controller).
spring.jpa.open-in-view=false

# Mostra no log o SQL que o Hibernate gerou (ex.: o SQL do findByTipo()).
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
